[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spare-parts-system"
version = "0.1.0"
description = "Yamaha motorcycle spare-parts demand forecasting and inventory-policy system"
requires-python = ">=3.12"
dependencies = [
    # Core data
    "pandas>=2.2",
    "polars>=0.20",
    "numpy>=1.26",
    "pyarrow>=15.0",
    # Stats / ML
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    "prophet>=1.1",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    # Time series
    "statsforecast>=1.7",
    # PDF extraction
    "pdfplumber>=0.10",
    "pymupdf>=1.24",
    # Excel I/O
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    # Validation
    "pandera[all]>=0.19",
    # Experiment tracking
    "mlflow>=2.12",
    # DB
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    # Dashboard
    "streamlit>=1.33",
    # Reports
    "python-docx>=1.1",
    # Logging
    "loguru>=0.7",
    # Config
    "pydantic-settings>=2.2",
    # CLI / utilities
    "typer>=0.12",
    "rich>=13.7",
    "pytesseract>=0.3.13",
    "neuralforecast>=3.1.8",
    "shap>=0.49.1",
    "stable-baselines3>=2.8.0",
    "gymnasium>=1.2.3",
    "plotly>=6.7.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]

[project.optional-dependencies]
pdf-tables = [
    "camelot-py[cv]>=0.11",
    "tabula-py>=2.9",
    "pytesseract>=0.3",
    "pdf2image>=1.17",
]
reports-pdf = [
    "weasyprint>=61.0",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
neural-ts = [
    "neuralforecast>=1.7",
]
sap = [
    # pyrfc is yanked on PyPI; install manually from SAP GitHub when targeting Linux
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-openpyxl>=3.1",
]
all = [
    "spare-parts-system[pdf-tables,reports-pdf,rl,neural-ts,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"notebooks/**" = ["E402", "ANN", "F401"]
"scripts/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.models.*", "src.db.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/notebooks/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
